name: Import v0.22 source from staging

on:
  push:
    branches: [upload-v022]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload-v022
          fetch-depth: 0

      - name: Download staged v0.22 ZIP
        run: |
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1bJxUYZCqunP18c-rp_0TzDFLNhUqNxoo' -O /tmp/mb-v022.zip
          unzip -q /tmp/mb-v022.zip -d /tmp/mb-v022
          ROOT_DIR="$(find /tmp/mb-v022 -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT_DIR"
          test -f "$ROOT_DIR/VERSION.json"
          test -f "$ROOT_DIR/README.md"
          test -f "$ROOT_DIR/src/main/java/com/modernbackport/ModernBackportMod.java"
          python - "$ROOT_DIR/VERSION.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['version']=='0.22.0', d
          assert d['minecraft_target']=='1.12.2', d
          PY
          echo "ROOT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"

      - name: Replace staging branch with verified source tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$ROOT_DIR"/. .
          git add -A
          git config user.name 'ModernBackport Import Bot'
          git config user.email 'actions@github.com'
          git commit -m 'Import ModernBackport v0.22'
          git push origin HEAD:upload-v022
